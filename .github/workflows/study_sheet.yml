name: 오늘의 주식 학습지

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 평일 16:00 KST (UTC 07:00)
  workflow_dispatch:

jobs:
  study-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install pykrx requests anthropic python-dotenv

      - name: 학습지 발송
        run: python -c "from modules.study_sheet import run_study_sheet; run_study_sheet()"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
