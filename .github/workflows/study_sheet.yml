name: 오늘의 주식 학습지

on:
  workflow_dispatch:

jobs:
  study-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install pykrx requests anthropic python-dotenv beautifulsoup4 lxml

      - name: 학습지 노션 저장
        run: python -c "from modules.study_sheet import run_study_sheet; run_study_sheet()"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
