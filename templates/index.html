<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAI — 주가 변동 분석기</title>
<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #0d0d12;
  --surface: #16161f;
  --surface2: #1e1e2a;
  --border: #2a2a38;
  --text: #e2e2ee;
  --muted: #6b6b85;
  --accent: #7c6af7;
  --accent2: #9d8fff;
  --red: #f87171;
  --blue: #60a5fa;
  --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.03em; }
.logo span { color: var(--accent); }
.badge {
  font-size: 0.68rem;
  padding: 2px 8px;
  background: #2a1f5e;
  color: var(--accent2);
  border-radius: 20px;
  border: 1px solid #3d2e8a;
}
main { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }

/* Search */
.search-wrap { margin-bottom: 36px; }
.search-wrap h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.03em; }
.search-wrap p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
.search-form { display: flex; gap: 10px; }
.search-form input {
  flex: 1;
  padding: 13px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-form input:focus { border-color: var(--accent); }
.search-form input::placeholder { color: var(--muted); }
.search-form button {
  padding: 13px 24px;
  background: var(--accent);
  border: none;
  border-radius: var(--r);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.search-form button:hover { opacity: 0.85; }
.search-form button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Popular surging stocks */
.popular-section { margin-bottom: 32px; }
.popular-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.popular-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34,197,94,0.4);
  animation: live-pulse 2s infinite;
}
@keyframes live-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
  70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}
.popular-title { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.popular-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
@media (max-width: 540px) { .popular-grid { grid-template-columns: repeat(2, 1fr); } }
.popular-card {
  padding: 11px 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
  min-width: 0;
}
.popular-card:hover { border-color: var(--accent); background: var(--surface2); }
.popular-rank { font-size: 0.62rem; color: var(--muted); margin-bottom: 4px; }
.popular-name {
  font-size: 0.83rem; font-weight: 600; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popular-price { font-size: 0.72rem; color: var(--muted); margin-bottom: 2px; }
.popular-rate { font-size: 0.82rem; font-weight: 700; }
.popular-skeleton {
  height: 80px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; animation: sk-pulse 1.4s ease-in-out infinite;
}
@keyframes sk-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }

/* Progress */
.progress {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 20px;
  font-size: 0.88rem;
  color: var(--muted);
}
.progress.show { display: flex; }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error */
.error-box {
  display: none;
  padding: 14px 18px;
  background: #2a1515;
  border: 1px solid #5c2a2a;
  border-radius: var(--r);
  color: var(--red);
  font-size: 0.88rem;
  margin-bottom: 20px;
}
.error-box.show { display: block; }

/* Cards */
.card {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 22px 24px;
  margin-bottom: 14px;
}
.card.show { display: block; }
.card-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 14px;
}

/* Price + Chart unified card */
.pc-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.price-name { font-size: 1.3rem; font-weight: 700; }
.price-code { font-size: 0.85rem; color: var(--muted); }
.price-rate { margin-left: auto; font-size: 1.1rem; font-weight: 700; }
.up { color: var(--red); }
.down { color: var(--blue); }
.flat { color: var(--muted); }
.pc-sub { display: flex; gap: 20px; font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
.pc-sub strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Analysis — headline */
.analysis-headline {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  padding-bottom: 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

/* Analysis — phases */
.analysis-phases { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.phase-item {
  padding: 13px 16px;
  background: var(--surface2);
  border-radius: 10px;
}
.phase-header { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.phase-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 700; flex-shrink: 0;
}
.phase-icon.up   { background: rgba(248,113,113,0.15); color: var(--red); }
.phase-icon.down { background: rgba(96,165,250,0.15);  color: var(--blue); }
.phase-icon.flat { background: rgba(107,107,133,0.15); color: var(--muted); }
.phase-label { font-size: 0.88rem; font-weight: 600; }
.phase-label.up   { color: var(--red); }
.phase-label.down { color: var(--blue); }
.phase-label.flat { color: var(--muted); }
.phase-time   { font-size: 0.75rem; color: var(--muted); }
.phase-change { margin-left: auto; font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.phase-reason { font-size: 0.84rem; color: var(--muted); line-height: 1.45; padding-left: 29px; }

/* Analysis — detail toggle */
.detail-toggle {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 0.82rem;
  cursor: pointer;
  padding: 6px 0;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s;
}
.detail-toggle:hover { color: var(--text); }
.analysis-detail {
  display: none;
  font-size: 0.9rem;
  line-height: 1.75;
  color: var(--muted);
  padding-top: 12px;
}
.analysis-detail.open { display: block; }

/* Chart */
#chart-el { width: 100%; height: 260px; }

/* News */
.news-list { list-style: none; }
.news-item {
  display: flex;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none; }
.news-time { font-size: 0.75rem; color: var(--muted); white-space: nowrap; min-width: 100px; padding-top: 2px; }
.news-title { font-size: 0.88rem; line-height: 1.45; }
.news-source { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">Stock<span>AI</span></div>
  <span class="badge">powered by Claude</span>
</header>

<main>
  <div class="search-wrap">
    <h2>주가 변동 분석기</h2>
    <p>종목명을 입력하면 최신 주가와 뉴스를 바탕으로 AI가 변동 원인을 분석합니다.</p>
    <form class="search-form" onsubmit="runAnalyze(event)">
      <input id="q" type="text" placeholder="삼성전자, 카카오, 니케이, 나스닥..." autocomplete="off" />
      <button type="submit" id="btn">분석하기</button>
    </form>
  </div>

  <!-- 급등 인기 종목 -->
  <div class="popular-section" id="popular-section">
    <div class="popular-header">
      <div class="popular-live"></div>
      <span class="popular-title">급등 인기 종목</span>
    </div>
    <div class="popular-grid" id="popular-grid">
      <div class="popular-skeleton"></div><div class="popular-skeleton"></div>
      <div class="popular-skeleton"></div><div class="popular-skeleton"></div>
      <div class="popular-skeleton"></div><div class="popular-skeleton"></div>
      <div class="popular-skeleton"></div><div class="popular-skeleton"></div>
      <div class="popular-skeleton"></div><div class="popular-skeleton"></div>
    </div>
  </div>

  <div class="error-box" id="err"></div>
  <div class="progress" id="prog"><div class="spinner"></div><span id="prog-text">준비 중...</span></div>

  <div class="card" id="price-card">
    <div class="pc-header">
      <span class="price-name" id="p-name"></span>
      <span class="price-code" id="p-code"></span>
      <span class="price-rate" id="p-rate"></span>
    </div>
    <div class="pc-sub">
      <span>시가 <strong id="p-open"></strong></span>
      <span>현재가 <strong id="p-cur"></strong></span>
      <span id="p-time"></span>
    </div>
    <div id="chart-el"></div>
  </div>

  <div class="card" id="analysis-card">
    <div class="card-label">AI 분석</div>
    <div class="analysis-headline" id="a-headline"></div>
    <div class="analysis-phases" id="a-phases"></div>
    <button class="detail-toggle" onclick="toggleDetail()">
      상세 분석 <span id="toggle-icon">▼</span>
    </button>
    <div class="analysis-detail" id="a-detail"></div>
  </div>

  <div class="card" id="news-card">
    <div class="card-label">관련 뉴스</div>
    <ul class="news-list" id="n-list"></ul>
  </div>
</main>

<script>
const TZ_MAP = { KRW: 'Asia/Seoul', JPY: 'Asia/Tokyo', USD: 'America/New_York', HKD: 'Asia/Hong_Kong', CNY: 'Asia/Shanghai', EUR: 'Europe/Berlin', GBP: 'Europe/London' };
let chartInstance = null;

function fmt(v, currency) {
  if (typeof v !== 'number') return v || 'N/A';
  if (!currency || currency === 'KRW') return v.toLocaleString('ko-KR') + '원';
  return v.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + currency;
}

function reset() {
  ['price-card','analysis-card','news-card'].forEach(id => document.getElementById(id).classList.remove('show'));
  if (chartInstance) { chartInstance.remove(); chartInstance = null; }
  document.getElementById('err').classList.remove('show');
  document.getElementById('a-headline').textContent = '';
  document.getElementById('a-phases').innerHTML = '';
  document.getElementById('a-detail').textContent = '';
  document.getElementById('a-detail').classList.remove('open');
  document.getElementById('toggle-icon').textContent = '▼';
}

function showPrice(ticker, p) {
  document.getElementById('p-name').textContent = p.ticker_name || ticker;
  document.getElementById('p-code').textContent = ticker;
  const sign = p.change_sign || '';
  const rate = p.change_rate ?? 0;
  const rateEl = document.getElementById('p-rate');
  rateEl.textContent = `${sign}${rate}%`;
  rateEl.className = 'price-rate ' + (sign === '+' ? 'up' : sign === '-' ? 'down' : 'flat');
  document.getElementById('p-open').textContent = fmt(p.open_price, p.currency);
  document.getElementById('p-cur').textContent = fmt(p.current_price, p.currency);
  document.getElementById('p-time').textContent = p.as_of || '-';
  document.getElementById('price-card').classList.add('show');
}

async function showChart(chartData, currency) {
  if (!chartData || chartData.length === 0) return;
  const tz = TZ_MAP[currency] || 'UTC';
  const el = document.getElementById('chart-el');

  // 카드가 이미 show 상태 + 브라우저 레이아웃 완료 대기
  await new Promise(resolve => requestAnimationFrame(resolve));

  if (chartInstance) { chartInstance.remove(); chartInstance = null; }

  chartInstance = LightweightCharts.createChart(el, {
    autoSize: true,
    height: 260,
    layout: { background: { color: '#16161f' }, textColor: '#6b6b85' },
    grid: { vertLines: { color: '#2a2a38' }, horzLines: { color: '#2a2a38' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2a2a38' },
    timeScale: {
      borderColor: '#2a2a38',
      timeVisible: true,
      secondsVisible: false,
      tickMarkFormatter: t =>
        new Date(t * 1000).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', timeZone: tz }),
    },
  });

  const series = chartInstance.addCandlestickSeries({
    upColor: '#f87171', downColor: '#60a5fa',
    borderUpColor: '#f87171', borderDownColor: '#60a5fa',
    wickUpColor: '#f87171', wickDownColor: '#60a5fa',
  });
  series.setData(chartData);
  chartInstance.timeScale().fitContent();
}

function showNews(news) {
  document.getElementById('n-list').innerHTML = news.map(n => `
    <li class="news-item">
      <span class="news-time">${n.time || ''}</span>
      <div>
        <div class="news-title">${n.title || ''}</div>
        <div class="news-source">${n.source || ''}</div>
      </div>
    </li>`).join('');
  document.getElementById('news-card').classList.add('show');
}

function showAnalysis(result) {
  document.getElementById('a-headline').textContent = result.headline || '';

  document.getElementById('a-phases').innerHTML = (result.phases || []).map(p => {
    const isUp   = p.change?.startsWith('+');
    const isDown = p.change?.startsWith('-');
    const cls    = isUp ? 'up' : isDown ? 'down' : 'flat';
    const icon   = isUp ? '▲' : isDown ? '▼' : '─';
    return `
      <div class="phase-item">
        <div class="phase-header">
          <span class="phase-icon ${cls}">${icon}</span>
          <span class="phase-label ${cls}">${p.label || ''}</span>
          <span class="phase-time">${p.time || ''}</span>
          <span class="phase-change ${cls}">${p.change || ''}</span>
        </div>
        <div class="phase-reason">${p.reason || ''}</div>
      </div>`;
  }).join('');

  document.getElementById('a-detail').textContent = result.detail || '';
  document.getElementById('analysis-card').classList.add('show');
}

function toggleDetail() {
  const detail = document.getElementById('a-detail');
  const icon = document.getElementById('toggle-icon');
  icon.textContent = detail.classList.toggle('open') ? '▲' : '▼';
}

async function loadPopular() {
  try {
    const res = await fetch('/api/popular');
    const data = await res.json();
    const grid = document.getElementById('popular-grid');
    if (!data || !data.length) {
      document.getElementById('popular-section').style.display = 'none';
      return;
    }
    grid.innerHTML = data.map(s => {
      const cls = s.change_sign === '+' ? 'up' : s.change_sign === '-' ? 'down' : 'flat';
      const price = s.current_price ? s.current_price.toLocaleString('ko-KR') + '원' : '-';
      return `<div class="popular-card" onclick="pickPopular('${s.name}')">
        <div class="popular-rank">${s.rank}위</div>
        <div class="popular-name" title="${s.name}">${s.name}</div>
        <div class="popular-price">${price}</div>
        <div class="popular-rate ${cls}">${s.change_sign}${s.change_rate}%</div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('popular-section').style.display = 'none';
  }
}

function pickPopular(name) {
  document.getElementById('q').value = name;
  document.querySelector('.search-form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
}

document.addEventListener('DOMContentLoaded', loadPopular);

async function runAnalyze(e) {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;

  reset();
  document.getElementById('btn').disabled = true;
  const prog = document.getElementById('prog');
  const progText = document.getElementById('prog-text');
  prog.classList.add('show');

  try {
    const res = await fetch('/api/analyze?ticker_name=' + encodeURIComponent(q));
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const d = JSON.parse(part.slice(6));
        if (d.step === 'stock') {
          progText.textContent = '주가 데이터 수집 중...';
        } else if (d.step === 'stock_done') {
          showPrice(d.ticker, d.price);
          await showChart(d.chart, d.price.currency);
        } else if (d.step === 'news') {
          progText.textContent = '뉴스 수집 중...';
        } else if (d.step === 'news_done') {
          showNews(d.news);
        } else if (d.step === 'analyzing') {
          progText.textContent = 'Claude AI 분석 중...';
        } else if (d.step === 'done') {
          showAnalysis(d.result);
          prog.classList.remove('show');
        } else if (d.step === 'error') {
          document.getElementById('err').textContent = '오류: ' + d.msg;
          document.getElementById('err').classList.add('show');
          prog.classList.remove('show');
        }
      }
    }
  } catch (err) {
    document.getElementById('err').textContent = '연결 오류: ' + err.message;
    document.getElementById('err').classList.add('show');
    prog.classList.remove('show');
  }

  document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
